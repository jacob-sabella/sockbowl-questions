name: Java CI with Gradle and Docker

on:
  push:
    branches:
      - "main"
      - "release/**"
      - "goal/**"
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gradle/actions is pinned at v5, not the latest v6: v6 extracts its caching
# functionality into a separate `gradle-actions-caching` component under a
# proprietary commercial license (see
# https://blog.gradle.org/github-actions-for-gradle-v6), while v5 is a
# straightforward, MIT-licensed Node-24 bump from v4. Revisit if/when that
# licensing changes or the caching component is specifically wanted.
#
# Every other action below is pinned to its exact release tag; gradle/actions
# is the one deliberate exception, per the "v5 everywhere" M1 decision, so it
# keeps tracking v5.x patch releases automatically instead of needing a bump
# commit each time. This is intentional, not leftover inconsistency.

jobs:
  test:
    # CI-Q (M6): questions never ran its test suite in CI. Testcontainers
    # (Neo4j, Keycloak, Redis) reach straight into the runner's own Docker
    # daemon, exactly as they do on a dev machine — no extra setup step is
    # needed, ubuntu-latest ships Docker already. build-and-publish below
    # needs: this job, so a broken suite blocks the image build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew -S test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: build/test-results/test
          retention-days: 7

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compute project version
        id: ver
        run: |
          chmod +x gradlew
          echo "VERSION=$(./gradlew -q printVersion)" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build models jars
        run: ./gradlew -S clean modelsJar modelsSourcesJar

      # The remaining steps publish and push, and must never run for a PR or
      # a goal/** branch run (M6 CI-Q): only a push to main, or a tag, is
      # allowed to touch GitHub Packages or GHCR.
      - name: Publish models to GitHub Packages (Maven)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -S publish

      - name: Build Docker image with Spring Boot (pack)
        run: ./gradlew bootBuildImage

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ env.VERSION }}"
          docker push "${IMAGE_TAG}"

          # Also push as :main for main branch (without hash suffix)
          if [ "${{ github.ref_name }}" == "main" ]; then
            MAIN_TAG="ghcr.io/${{ github.repository }}:main"
            docker tag "${IMAGE_TAG}" "${MAIN_TAG}"
            docker push "${MAIN_TAG}"
            echo "Tagged and pushed as :main"
          fi

          # Immutable per-commit tag for the deploy job (main only).
          if [ "${{ github.ref_name }}" == "main" ]; then
            SHA_TAG="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            docker tag "${IMAGE_TAG}" "${SHA_TAG}"
            docker push "${SHA_TAG}"
          fi

  # Continuous deployment: after the image for this commit is published, ask
  # the prod host to switch questions to it. The key is restricted by a forced
  # command (sockbowl-docker scripts/deploy/ssh-deploy-gate.sh) to exactly
  # `deploy <service> <sha>`; the host pulls the sha-<sha> image, waits for
  # the healthcheck, and rolls back to the previous image if it fails.
  deploy:
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy-questions
      cancel-in-progress: false
    steps:
      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_HOST" "deploy questions ${GITHUB_SHA}"

  dependency-submission:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v5
