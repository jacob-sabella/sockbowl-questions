# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # M6 DEP1: group minor/patch bumps into one PR per run to cut noise;
      # majors still open individually so they get a human look.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # M6 ledger (audit/m6/deps-questions.json, S2 scout): stay on the last
      # stable Spring Boot line until 4.2.0 leaves milestone (4.2.0-M2 today).
      - dependency-name: "org.springframework.boot"
        versions: [">=4.2.0"]
      - dependency-name: "org.springframework.boot:*"
        versions: [">=4.2.0"]
      # Same decision for Spring Security's BOM-managed version (spring-security-test).
      - dependency-name: "org.springframework.security:spring-security-test"
        versions: [">=7.2.0"]
      # Same decision for Spring AI: stay on 2.0.1 until 2.1.0 leaves milestone (2.1.0-M1 today).
      - dependency-name: "org.springframework.ai:*"
        versions: [">=2.1.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
