server:
  port: "${SOCKBOWL_PORT:7009}"
  # M4: client IP for rate limits is request.getRemoteAddr() only. Forwarded
  # headers are trusted only with strategy=native AND an explicit trusted-proxy
  # regex; an EMPTY internal-proxies trusts everyone, so LimitsStartupValidator
  # refuses to start with native + blank regex (plan m4-limits section 2.1).
  # strategy=framework is refused outright by the same validator: it has no
  # trusted-proxy check at all, so it would trust any client's X-Forwarded-For.
  forward-headers-strategy: "${SOCKBOWL_FORWARD_HEADERS_STRATEGY:none}"
  tomcat:
    remoteip:
      internal-proxies: "${SOCKBOWL_TRUSTED_PROXIES_REGEX:}"
      # D26/M7: behind Cloudflare (via aa-caddy) this is CF-Connecting-IP;
      # x-forwarded-for is the default for a plain reverse proxy. Only read at
      # all with strategy=native and a non-blank internal-proxies regex above.
      remote-ip-header: "${SOCKBOWL_REMOTE_IP_HEADER:x-forwarded-for}"

management:
  endpoints:
    web:
      exposure:
        # Only health, for the compose healthcheck. Everything else
        # (env, beans, etc.) stays off: NoSecurityConfig (auth off) permits
        # every URL, and @PreAuthorize doesn't cover actuator. With auth on,
        # SecurityConfig denies every other actuator path anyway.
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # D12: every limiter, quota and ban check here fails open on a Redis
      # outage, and AI generation already fails closed per request (503
      # limiter_unavailable). Without this, a Redis blip still turns this
      # health check DOWN, which (via compose's depends_on: service_healthy)
      # blocks game and ng from starting or being recreated even though
      # nothing here actually stopped working. Game keeps Redis in its own
      # health check, because GameSession state lives in Redis OM.
      enabled: false

sockbowl:
  auth:
    enabled: "${SOCKBOWL_AUTH_ENABLED:false}"
    # Required "aud" entry on every bearer token (AUTH-09). Keycloak adds it
    # through the sockbowl-api-audience mapper on the Sockbowl clients.
    audience: "${SOCKBOWL_AUTH_AUDIENCE:sockbowl-api}"
  import:
    # Upper bounds for POST /api/qbreader/import-random; larger requests are
    # clamped down to these (AUTH-07).
    max-tossups: 30
    max-bonuses: 30
  packet:
    # Game-only EPHEMERAL packets (guest/player import-random, D15) are deleted
    # once older than this.
    ephemeral-ttl: "${SOCKBOWL_PACKET_EPHEMERAL_TTL:24h}"
    ephemeral-cleanup:
      enabled: true
      interval: PT1H
      initial-delay: PT5M
  cors:
    # Comma-separated allowlist; wired to SOCKBOWL_ALLOWED_ORIGINS in compose.
    allowed-origins: "${SOCKBOWL_ALLOWED_ORIGINS:http://localhost,http://localhost:80}"
  ai:
    provider: "${SOCKBOWL_AI_PROVIDER:openai}"
    require-user-api-key: "${SOCKBOWL_REQUIRE_USER_API_KEY:true}" # When true, users must provide their own API key via X-API-Key header
    packetgen:
      question-count: "${SOCKBOWL_PACKET_QUESTION_COUNT:5}"
    # M4 AI cost controls (D11, plan m4-limits section 2.6; enforced by WP-Q3's
    # AiGenerationGuard, which also charges the ai-generate rate policy).
    server-key:
      # Global per-UTC-day budget of server-key generations (fails closed).
      daily-budget: "${SOCKBOWL_AI_SERVER_DAILY_BUDGET:200}"
      # Models a server-key call may request via X-Model (comma-separated).
      # BYO-key calls may use any model.
      allowed-models: "${SOCKBOWL_AI_SERVER_ALLOWED_MODELS:${spring.ai.openai.chat.options.model}}"
    max-topic-length: 200
    max-context-length: 2000
    max-question-count: 30
    # ai:inflight:{sub} concurrency lock: TTL, and the Retry-After a second
    # concurrent call is told.
    inflight-ttl: 660s
    concurrency-retry-after: 30s
  # ---------------------------------------------------------------------------
  # M4 limits, quotas and abuse controls (plan m4-limits sections 2.1-2.4, 2.10).
  # The limiter core is a port of sockbowl-game's; the Redis key schema is shared
  # (UsageKeys). Every capacity the compose overlays tune has an explicit
  # ${SOCKBOWL_RL_*} placeholder, because relaxed env binding cannot target
  # dashed map keys.
  ratelimit:
    enabled: "${SOCKBOWL_RATELIMIT_ENABLED:true}"
    redis:
      timeout: 200ms
      connect-timeout: 500ms
      reconnect-backoff: 5s
    # azp values whose tokens are the SERVICE tier (on top of
    # sockbowl.auth.service-client-id, default sockbowl-game-backend).
    service-clients: "${SOCKBOWL_RL_SERVICE_CLIENTS:sockbowl-game-backend}"
    events:
      service: questions
      max-len: 1000
      sample-window: 10s
    exempt:
      - /actuator/health
      - /actuator/health/**
    tier-multipliers:
      guest: 1.0
      player: 1.0
      author: 2.0
      moderator: 3.0
      admin: 10.0
      service: 1.0
    policies:
      default:
        capacity: "${SOCKBOWL_RL_DEFAULT_CAPACITY:120}"
        refill-period: "${SOCKBOWL_RL_DEFAULT_REFILL_PERIOD:1m}"
        key-by: user-or-ip
      service:
        capacity: "${SOCKBOWL_RL_SERVICE_CAPACITY:6000}"
        refill-period: "${SOCKBOWL_RL_SERVICE_REFILL_PERIOD:1m}"
        key-by: user
      # Coarse cap on POST /graphql (a real HTTP 429). Its route opts out of the
      # default fallback; the game service token gets 20x (= the service ceiling).
      graphql-http:
        capacity: "${SOCKBOWL_RL_GRAPHQL_HTTP_CAPACITY:300}"
        refill-period: "${SOCKBOWL_RL_GRAPHQL_HTTP_REFILL_PERIOD:1m}"
        key-by: user-or-ip
        tier-multipliers:
          service: 20.0
      # Per top-level GraphQL field (WP-Q2's instrumentation).
      graphql-read:
        capacity: "${SOCKBOWL_RL_GRAPHQL_READ_CAPACITY:240}"
        refill-period: "${SOCKBOWL_RL_GRAPHQL_READ_REFILL_PERIOD:1m}"
        key-by: user-or-ip
      graphql-write:
        capacity: "${SOCKBOWL_RL_GRAPHQL_WRITE_CAPACITY:60}"
        refill-period: "${SOCKBOWL_RL_GRAPHQL_WRITE_REFILL_PERIOD:1m}"
        key-by: user
      # Charged by WP-Q3's AiGenerationGuard (REST generate and GraphQL
      # generateAndAddTossup), never by a route or field mapping, so a call is
      # charged once. Fails closed with Redis down (D12).
      ai-generate:
        capacity: "${SOCKBOWL_RL_AI_GENERATE_CAPACITY:10}"
        refill-period: "${SOCKBOWL_RL_AI_GENERATE_REFILL_PERIOD:1h}"
        key-by: user
        fail-closed: true
        # A cost control, not a UX limit: authors and moderators (the only
        # tiers with question:generate) get the flat 10/h, not the global 2x/3x.
        tier-multipliers:
          author: 1.0
          moderator: 1.0
      import:
        capacity: "${SOCKBOWL_RL_IMPORT_CAPACITY:10}"
        refill-period: "${SOCKBOWL_RL_IMPORT_REFILL_PERIOD:1h}"
        key-by: user
      import-ip:
        capacity: "${SOCKBOWL_RL_IMPORT_IP_CAPACITY:20}"
        refill-period: "${SOCKBOWL_RL_IMPORT_IP_REFILL_PERIOD:1h}"
        key-by: ip
      bank-read:
        capacity: "${SOCKBOWL_RL_BANK_READ_CAPACITY:30}"
        refill-period: "${SOCKBOWL_RL_BANK_READ_REFILL_PERIOD:1m}"
        key-by: user-or-ip
    routes:
      - method: POST
        pattern: /graphql
        policies: [graphql-http]
        fallback: false
      - method: POST
        pattern: /api/qbreader/import-random
        policies: [import, import-ip]
      - method: POST
        pattern: /api/qbreader/count
        policies: [bank-read]
      - method: GET
        pattern: /api/qbreader/category-counts
        policies: [bank-read]
      - method: GET
        pattern: /api/qbreader/taxonomy-counts
        policies: [bank-read]
      - method: GET
        pattern: /api/qbreader/stats
        policies: [bank-read]
      - method: GET
        pattern: /api/qbreader/dimensions
        policies: [bank-read]
    graphql:
      # Top-level field -> policy for WP-Q2's field-level limiter. Unmapped
      # Mutation fields use graphql-write, unmapped Query fields graphql-read.
      # generateAndAddTossup stays on graphql-write here: its ai-generate charge
      # is made by the AiGenerationGuard (WP-Q3) so it is never charged twice.
      # INT1 adds M3's import/clone mutations.
      default-query-policy: graphql-read
      default-mutation-policy: graphql-write
      fields:
        generateAndAddTossup: graphql-write
      # Static caps (WP-Q2). max-complexity is 2x the largest ng/game document
      # (game PacketClient getPacketById = 41; see GraphQlLimitsConfig). INT1
      # re-measures with M3's documents.
      max-depth: 15
      max-complexity: 82
  quota:
    enabled: "${SOCKBOWL_QUOTA_ENABLED:true}"
    daily-ttl: 48h
    # FIX3-Q item 2: how long a contended packets-owned lock is spin-waited before
    # giving up with 429 rate_limited (policy packets-owned-lock). Lowered from an
    # earlier 5s, which pinned a servlet thread that long under contention.
    packets-owned-lock-spin-timeout: "${SOCKBOWL_QUOTA_PACKETS_OWNED_LOCK_SPIN_TIMEOUT:1500ms}"
    # D10/D11 defaults; -1 = unlimited. Metric names with a dot need the
    # bracketed key. packets-owned is counted in Neo4j, the rest in Redis.
    tiers:
      guest:
        "[ai.generations]": 0
        imports: 0
        packets-owned: 0
      player:
        "[ai.generations]": 0
        imports: 0
        packets-owned: 0
      author:
        "[ai.generations]": "${SOCKBOWL_QUOTA_AUTHOR_AI_GENERATIONS:20}"
        imports: "${SOCKBOWL_QUOTA_AUTHOR_IMPORTS:10}"
        packets-owned: "${SOCKBOWL_QUOTA_AUTHOR_PACKETS_OWNED:300}"
      moderator:
        "[ai.generations]": "${SOCKBOWL_QUOTA_MODERATOR_AI_GENERATIONS:20}"
        imports: "${SOCKBOWL_QUOTA_MODERATOR_IMPORTS:10}"
        packets-owned: "${SOCKBOWL_QUOTA_MODERATOR_PACKETS_OWNED:300}"
      admin:
        "[ai.generations]": -1
        imports: -1
        packets-owned: -1
  # Enforcement of game-published bans (D8, WP-Q4). Both checks fail open.
  bans:
    # ban:{sub} lookups are cached this long per subject.
    cache-ttl: 30s
  ipban:
    # ipban:all is reloaded into memory this often.
    refresh-interval: 15s
  admin:
    usage:
      # GET /api/admin/usage/content-counts?subs=... accepts at most this many.
      max-subs: 100

spring:
  data:
    redis:
      # The Redis shared with sockbowl-game (limits, quotas, bans, usage); the
      # database must be the same number game uses.
      host: "${SOCKBOWL_REDIS_HOST:localhost}"
      port: "${SOCKBOWL_REDIS_PORT:6379}"
      database: "${SOCKBOWL_DATABASE:0}"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sockbowl}"
          # Keys are fetched from here directly (no OIDC discovery at boot).
          jwk-set-uri: "${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}"
  mvc:
    async:
      request-timeout: 600000
  ai:
    # model.chat picks which provider's ChatModel autoconfiguration actually
    # runs (Spring AI 2.0's own selector). AiChatModelSelectorEnvironmentPostProcessor
    # derives it from the openai/ollama chat.enabled flags below (which compose
    # sets via SPRING_AI_OPENAI_CHAT_ENABLED / SPRING_AI_OLLAMA_CHAT_ENABLED) so
    # that setting either, both or neither flag keeps working — set model.chat
    # directly (e.g. SPRING_AI_MODEL_CHAT=openai) to skip that derivation.
    openai:
      api-key: "${OPENAI_API_KEY:sk-openai-key}"
      chat:
        enabled: true
        options:
          model: gpt-5.1-2025-11-13 # or gpt-4o-mini for faster/cheaper, gpt-4-turbo for previous generation
          temperature: 1
      embedding:
        enabled: false
    ollama:
      chat:
        enabled: false
        options:
          model: "deepseek-r1:70b"
      embedding:
        enabled: true
        options:
          model: "mxbai-embed-large" # 1024 dimensions
  neo4j:
    uri: "${SOCKBOWL_NEO4J_URL:bolt://localhost:7687}"
    authentication:
      username: "${SOCKBOWL_NEO4J_USER:neo4j}"
      password: "${SOCKBOWL_NEO4J_PASSWORD:123456789}"
    security:
      encrypted: false
    vectorstore:
      neo4j:
        initialize-schema: true
        embedding-property: embedding
        database-name: neo4j
        index-name: custom-index
        embedding-dimension: 1024 # Ollama nomic-embed-text dimensions
