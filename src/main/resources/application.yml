server:
  port: "${SOCKBOWL_PORT:7009}"

management:
  endpoints:
    web:
      exposure:
        # Only health, for the compose healthcheck. Everything else
        # (env, beans, etc.) stays off: NoSecurityConfig (auth off) permits
        # every URL, and @PreAuthorize doesn't cover actuator. With auth on,
        # SecurityConfig denies every other actuator path anyway.
        include: health
  endpoint:
    health:
      show-details: never

sockbowl:
  auth:
    enabled: "${SOCKBOWL_AUTH_ENABLED:false}"
    # Required "aud" entry on every bearer token (AUTH-09). Keycloak adds it
    # through the sockbowl-api-audience mapper on the Sockbowl clients.
    audience: "${SOCKBOWL_AUTH_AUDIENCE:sockbowl-api}"
  import:
    # Upper bounds for POST /api/qbreader/import-random; larger requests are
    # clamped down to these (AUTH-07).
    max-tossups: 30
    max-bonuses: 30
  packet:
    # Game-only EPHEMERAL packets (guest/player import-random, D15) are deleted
    # once older than this.
    ephemeral-ttl: "${SOCKBOWL_PACKET_EPHEMERAL_TTL:24h}"
    ephemeral-cleanup:
      enabled: true
      interval: PT1H
      initial-delay: PT5M
    # Authoring limits (M3, PacketLimitsProperties). Override with env vars via relaxed
    # binding, e.g. SOCKBOWL_PACKET_LIMITS_NAME_MAX, SOCKBOWL_PACKET_IMPORT_MAX_BYTES.
    limits:
      name-max: 200
      question-max: 4000        # tossup question / bonus part question
      answer-max: 1000
      preamble-max: 2000
      max-tossups: 60
      max-bonuses: 60
      max-parts-per-bonus: 6
      min-parts-per-bonus: 1    # hard floor; 3 is the D7 "expected" count (warning only)
    import:
      max-bytes: 524288         # 512 KiB of UTF-8 plaintext (D5 import)
    taxonomy:
      name-max: 100
      dedupe-on-startup: false  # never destructive by default; use the admin merge action
  cors:
    # Comma-separated allowlist; wired to SOCKBOWL_ALLOWED_ORIGINS in compose.
    allowed-origins: "${SOCKBOWL_ALLOWED_ORIGINS:http://localhost,http://localhost:80}"
  ai:
    provider: "${SOCKBOWL_AI_PROVIDER:openai}"
    require-user-api-key: "${SOCKBOWL_REQUIRE_USER_API_KEY:true}" # When true, users must provide their own API key via X-API-Key header
    packetgen:
      question-count: "${SOCKBOWL_PACKET_QUESTION_COUNT:5}"

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sockbowl}"
          # Keys are fetched from here directly (no OIDC discovery at boot).
          jwk-set-uri: "${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}"
  mvc:
    async:
      request-timeout: 600000
  ai:
    # model.chat picks which provider's ChatModel autoconfiguration actually
    # runs (Spring AI 2.0's own selector). AiChatModelSelectorEnvironmentPostProcessor
    # derives it from the openai/ollama chat.enabled flags below (which compose
    # sets via SPRING_AI_OPENAI_CHAT_ENABLED / SPRING_AI_OLLAMA_CHAT_ENABLED) so
    # that setting either, both or neither flag keeps working — set model.chat
    # directly (e.g. SPRING_AI_MODEL_CHAT=openai) to skip that derivation.
    openai:
      api-key: "${OPENAI_API_KEY:sk-openai-key}"
      chat:
        enabled: true
        options:
          model: gpt-5.1-2025-11-13 # or gpt-4o-mini for faster/cheaper, gpt-4-turbo for previous generation
          temperature: 1
      embedding:
        enabled: false
    ollama:
      chat:
        enabled: false
        options:
          model: "deepseek-r1:70b"
      embedding:
        enabled: true
        options:
          model: "mxbai-embed-large" # 1024 dimensions
  neo4j:
    uri: "${SOCKBOWL_NEO4J_URL:bolt://localhost:7687}"
    authentication:
      username: "${SOCKBOWL_NEO4J_USER:neo4j}"
      password: "${SOCKBOWL_NEO4J_PASSWORD:123456789}"
    security:
      encrypted: false
    vectorstore:
      neo4j:
        initialize-schema: true
        embedding-property: embedding
        database-name: neo4j
        index-name: custom-index
        embedding-dimension: 1024 # Ollama nomic-embed-text dimensions
