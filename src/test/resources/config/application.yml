# Test-only overrides, layered ON TOP of src/main/resources/application.yml.
#
# This file lives under config/ on purpose: Spring Boot loads both
# classpath:/application.yml and classpath:/config/application.yml, the latter
# winning key by key. A test-classpath application.yml at the root would instead
# SHADOW the main one entirely (the same classpath resource name), hiding every
# shipped key from every test (sockbowl-game hit exactly that in M4).
#
# M4: the limiter is off for the suite (no Redis is needed). The request guard
# filter still runs its ban checks (no-ops without the Q4 checkers). A test that
# exercises limits turns it back on (sockbowl.ratelimit.enabled=true) and points
# spring.data.redis.* at a Redis Testcontainer; the shipped policies stay visible.
sockbowl:
  ratelimit:
    enabled: false
