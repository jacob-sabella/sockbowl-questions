pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = 'https://repo.spring.io/milestone'
        }
    }
}

plugins {
    // Auto-provisions the Java 25 toolchain (build.gradle) when it isn't
    // already installed locally, instead of failing the build.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'sockbowl-questions'